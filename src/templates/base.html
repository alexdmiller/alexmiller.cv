<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Miller</title>

  <style>
    :root {
      --header-h: 76px;
      --panel-w: 88px;
      --thumb-w: 73px;
      --feed-w: 840px;
      --media-gap: 16px;
      --panel-bg: #efefef;
      --ink: #111111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 18px;
      color: var(--ink);
      background: #fff;
    }

    a {
      color: var(--ink);
    }

    .app {
      position: relative;
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    /* ------------ thumbnail panel (slides out on mobile) ----------- */

    .panel {
      width: 0;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--panel-bg);
      transition: width 0.35s ease;
    }

    .app.open .panel {
      width: var(--panel-w);
    }

    .panel-inner {
      width: var(--panel-w);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .panel-top {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn {
      border: 0;
      background: transparent;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .thumbs {
      /* offsetTop of thumbs is measured against this */
      position: relative;
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      /* bottom room so late thumbs can reach the middle */
      padding: 52px 0 380px 0;
      display: flex;
      flex-direction: column;
      gap: 72px;
    }

    .thumbs::-webkit-scrollbar {
      display: none;
    }

    .thumb-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thumb-row {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .thumb {
      width: var(--thumb-w);
      flex-shrink: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .thumb img {
      display: block;
      width: 100%;
      height: auto;
      outline: 1.5px solid transparent;
      object-fit: cover;
      background: #dcdcdc;
    }

    .thumb.active img {
      outline-color: var(--ink);
    }

    .vlabel {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    /* ------------ main column ----------- */

    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* floats over the feed with no background, so media scrolls underneath it */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      height: var(--header-h);
      display: flex;
      align-items: center;
      padding-left: 18px;
      pointer-events: none;
    }

    header>* {
      pointer-events: auto;
    }

    /* centered on the page rather than the column, so it stays put when the panel opens */
    .name {
      position: absolute;
      top: calc(var(--header-h) / 2);
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 1.2;
      font-size: 18px;
      text-decoration: none;
      border-bottom: 2px solid #000;
      white-space: nowrap;
    }

    .menu-btn {
      width: 37px;
      height: 44px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
    }

    .menu-btn .bar {
      width: 37px;
      height: 15px;
      background: #d9d9d9;
    }

    .app.open .menu-btn {
      visibility: hidden;
    }

    .feed {
      /* offsetTop of media is measured against this */
      position: relative;
      flex: 1;
      overflow-y: auto;
      padding: calc(var(--header-h) + 24px) 0 320px;
      display: flex;
      flex-direction: column;
      gap: 56px;
      transition: padding-left 0.35s ease;
    }

    .project {
      display: flex;
      flex-direction: column;
    }

    .project-head {
      padding: 0 18px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      transition: padding-left 0.35s ease;
    }

    .project-date {
      display: none;
    }

    .project-collaborators {
      padding: 0 18px;
      margin-bottom: 14px;
      line-height: 1.2;
      transition: padding-left 0.35s ease;
    }

    .project-collaborators a {
      color: blue;
      text-decoration: none;
    }

    .project-collaborators a:hover {
      text-decoration: underline;
    }

    /* fills the column, unless that would make the media taller than 90% of the
       screen; --w / --h are set per item from the media's dimensions */
    .media-item {
      width: min(100%, calc(90dvh * var(--w) / var(--h)));
      margin: 0 auto;
    }

    .media-item+.media-item {
      margin-top: var(--media-gap);
    }

    .feed .media {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: var(--w) / var(--h);
      object-fit: cover;
      background: #efefef;
    }

    .attribution {
      margin-top: 6px;
      padding: 0 18px;
      font-size: 12px;
      line-height: 1.3;
      transition: padding-left 0.35s ease;
    }

    /* videos over 10s: paused with sound until the play button is clicked */
    .long-video {
      position: relative;
    }

    .long-video video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      inset: 0;
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn[hidden] {
      display: none;
    }

    /* ------------ mobile: feed makes room when the panel is open ----------- */

    @media (max-width: 767px) {
      .app.open .feed {
        padding-left: 24px;
      }

      .app.open .project-head,
      .app.open .project-collaborators,
      .app.open .attribution {
        padding-left: 0;
      }
    }

    /* ------------ desktop: thumbnails always visible, feed centered ----------- */

    @media (min-width: 768px) {
      :root {
        --panel-w: 150px;
        --thumb-w: 94px;
        --media-gap: 40px;
      }

      .panel,
      .app.open .panel {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 1;
        width: var(--panel-w);
        background: transparent;
        transition: none;
      }

      .panel-top,
      .menu-btn {
        display: none;
      }

      .thumbs {
        padding: calc(var(--header-h) + 17px) 0 380px 28px;
        gap: 86px;
      }

      .thumb-group {
        gap: 13px;
      }

      /* inactive thumbs are dimmed until the cursor is over the column */
      .thumb {
        opacity: 0.45;
      }

      .thumb.active,
      .panel:hover .thumb {
        opacity: 1;
      }

      .thumb img {
        outline-offset: 2px;
      }

      /* centered on the page; falls back to clearing the panel on narrow windows */
      .feed {
        padding: calc(var(--header-h) + 34px) max(var(--panel-w), calc((100% - var(--feed-w)) / 2)) 320px;
        gap: 110px;
        transition: none;
      }

      .project-head {
        padding: 0;
        margin-bottom: 16px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 1em;
      }

      .project-date {
        display: block;
      }

      .project-collaborators {
        padding: 0;
        margin: 8px 0 24px;
      }

      .attribution {
        padding: 0;
      }

      .project-location {
        text-align: right;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <aside class="panel" aria-label="Project images">
      <div class="panel-inner">
        <div class="panel-top">
          <button class="close-btn" id="closeBtn" aria-label="Close project menu">
            <span>CLOSE</span>
            <svg width="38" height="14" viewBox="0 0 38 14" aria-hidden="true">
              <path d="M37 7H1M7 1L1 7l6 6" fill="none" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </div>
        <div class="thumbs" id="thumbs">
          <%block name="thumbs"></%block>
        </div>
      </div>
    </aside>

    <main>
      <header>
        <button class="menu-btn" id="menuBtn" aria-label="Open project menu" aria-expanded="false">
          <span class="bar"></span><span class="bar"></span>
        </button>
        <a class="name" href="/">Alex Miller</a>
      </header>
      <div class="feed" id="feed">
        <%block name="feed"></%block>
      </div>
    </main>
  </div>

  <script>
    const app = document.getElementById('app');
    const feed = document.getElementById('feed');       // right column (scrolls)
    const thumbsEl = document.getElementById('thumbs'); // left column (follows)
    const menuBtn = document.getElementById('menuBtn');
    const media = [...feed.querySelectorAll('.media')];      // big images / videos, in order
    const thumbs = [...thumbsEl.querySelectorAll('.thumb')]; // thumbnail buttons, same order

    /* ------------------------------------------------------------------
       Sync logic.
       An "anchor" {i, t} says where the middle of the feed sits: between
       media i and media i+1, a fraction t of the way along. The thumbnail
       column is scrolled so the same {i, t} lands at its own middle, which
       makes it glide continuously instead of jumping between thumbs.
    ------------------------------------------------------------------- */
    const centers = (els) => els.map((el) => el.offsetTop + el.offsetHeight / 2);
    const at = (cs, a) => (a.i + 1 < cs.length ? cs[a.i] + a.t * (cs[a.i + 1] - cs[a.i]) : cs[a.i]);

    function measure() {
      const rc = centers(media);
      const c = feed.scrollTop + feed.clientHeight / 2;
      if (c <= rc[0]) return { i: 0, t: 0 };
      for (let i = 0; i < rc.length - 1; i++) {
        if (c < rc[i + 1]) return { i, t: (c - rc[i]) / (rc[i + 1] - rc[i]) };
      }
      return { i: rc.length - 1, t: 0 };
    }

    function syncLeft(a) {
      thumbsEl.scrollTop = at(centers(thumbs), a) - thumbsEl.clientHeight / 2;
    }

    function holdFeed(a) {
      feed.scrollTop = at(centers(media), a) - feed.clientHeight / 2;
    }

    let active = -1;
    function setActive(n) {
      if (n === active) return;
      if (thumbs[active]) thumbs[active].classList.remove('active');
      active = n;
      thumbs[active].classList.add('active');
    }

    function sync() {
      if (!media.length) return;
      const a = measure();
      syncLeft(a);
      setActive(Math.min(media.length - 1, a.t < 0.5 ? a.i : a.i + 1));
    }

    function goTo(i) {
      feed.scrollTo({ top: centers(media)[i] - feed.clientHeight / 2, behavior: 'smooth' });
    }

    /* Open/close: the feed narrows while the panel slides in, which would
       shift the content, so keep the current anchor pinned during the
       transition. */
    function toggle() {
      const anchor = measure();
      const open = app.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(open));
      const start = performance.now();
      (function step() {
        holdFeed(anchor);
        syncLeft(anchor);
        if (performance.now() - start < 450) requestAnimationFrame(step);
        else sync();
      })();
    }

    thumbs.forEach((btn, i) => btn.addEventListener('click', () => goTo(i)));

    let raf = 0;
    feed.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; sync(); });
    }, { passive: true });
    window.addEventListener('resize', sync);
    menuBtn.addEventListener('click', toggle);
    document.getElementById('closeBtn').addEventListener('click', toggle);

    /* Short looping videos play muted, and only while on screen. */
    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting) target.play().catch(() => { });
        else target.pause();
      });
    }, { root: feed, threshold: 0.25 });
    feed.querySelectorAll('video.media[loop]').forEach((video) => videoObserver.observe(video));

    /* Long videos wait for the play button, then play with sound and native
       controls. They pause when scrolled off screen so audio doesn't linger. */
    const pauseObserver = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (!isIntersecting) target.pause();
      });
    }, { root: feed });
    feed.querySelectorAll('.long-video').forEach((wrap) => {
      const video = wrap.querySelector('video');
      const playBtn = wrap.querySelector('.play-btn');
      playBtn.addEventListener('click', () => {
        playBtn.hidden = true;
        video.controls = true;
        video.play();
      });
      pauseObserver.observe(video);
    });

    requestAnimationFrame(sync);
  </script>
</body>

</html>
