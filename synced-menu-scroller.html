<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex Miller — Synced menu scroller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
<style>
  :root {
    --panel-w: 96px;
    --thumb-w: 66px;
    --panel-bg: #efefef;
    --ink: #111111;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Geist', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: #fff;
  }
  a { color: var(--ink); }

  .app { display: flex; height: 100dvh; overflow: hidden; }

  /* ---- Slide-out thumbnail panel ---- */
  .panel {
    width: 0;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--panel-bg);
    transition: width 0.35s ease;
  }
  .app.open .panel { width: var(--panel-w); }
  .panel-inner { width: var(--panel-w); height: 100%; display: flex; flex-direction: column; }
  .panel-top { height: 64px; flex-shrink: 0; display: flex; align-items: center; padding-left: 12px; }
  .thumbs {
    position: relative;          /* offsetTop of thumbs is measured against this */
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 8px 0 380px 8px;   /* bottom room so late thumbs can reach the middle */
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumb-group { display: flex; flex-direction: column; gap: 10px; }
  .thumb-row { display: flex; align-items: center; gap: 3px; }
  .thumb {
    width: var(--thumb-w);
    padding: 0; border: 0; background: transparent; cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  .thumb .fill { width: 100%; outline: 1.5px solid transparent; outline-offset: 2px; background-size: cover; background-position: center; }
  .thumb.active { opacity: 1; }
  .thumb.active .fill { outline-color: var(--ink); }
  .vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; letter-spacing: 0.04em; }

  /* ---- Main column ---- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { height: 64px; flex-shrink: 0; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; }
  .name { justify-self: center; font-size: 17px; text-underline-offset: 4px; white-space: nowrap; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; background: transparent; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: center;
    justify-self: center;
  }
  .icon-btn .bar { width: 26px; height: 9px; background: #cfcfcf; }
  .app.open .menu-btn { visibility: hidden; }

  .feed {
    position: relative;          /* offsetTop of images is measured against this */
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 320px;
    display: flex;
    flex-direction: column;
    gap: 48px;
  }
  .project { display: flex; flex-direction: column; gap: 14px; }
  .project-head { padding: 0 18px; display: flex; flex-direction: column; gap: 2px; }
  .image {
    width: 100%;
    background-size: cover; background-position: center;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 10px;
  }
  .chip { background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; padding: 3px 7px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="panel" aria-label="Project images">
    <div class="panel-inner">
      <div class="panel-top">
        <button class="icon-btn" id="closeBtn" aria-label="Close project menu">
          <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M21 1L1 13l20 12z" fill="#8a8a8a"/></svg>
        </button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </aside>

  <main>
    <header>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open project menu" aria-expanded="false">
        <span class="bar"></span><span class="bar"></span>
      </button>
      <a class="name" href="#">Alex Miller</a>
      <span></span>
    </header>
    <div class="feed" id="feed"></div>
  </main>
</div>

<script>
/* ------------------------------------------------------------------
   Content. Swap `color` for `src: 'path/to/image.jpg'` when you have
   real images; `ar` is the image's aspect ratio (width / height).
------------------------------------------------------------------- */
const PROJECTS = [
  { title: 'Light Quilt', venue: 'SPAM new media festival', images: [
    { color: '#1f7a8c', ar: '4 / 3' }, { color: '#2a5ea8', ar: '4 / 3', video: true },
    { color: '#b8336a', ar: '4 / 3' }, { color: '#6b6b6b', ar: '1 / 1' } ] },
  { title: 'Zig Zag', venue: '[VENUE]', images: [
    { color: '#5b3fa0', ar: '16 / 9' }, { color: '#2f7d4f', ar: '4 / 3' },
    { color: '#c25a1b', ar: '16 / 9', video: true } ] },
  { title: '[PROJECT TITLE]', venue: '[VENUE]', images: [
    { color: '#8a6d1f', ar: '3 / 4' }, { color: '#a83232', ar: '4 / 3' },
    { color: '#3d5a80', ar: '1 / 1' } ] },
  { title: '[PROJECT TITLE]', venue: '[VENUE]', images: [
    { color: '#7a2f6b', ar: '4 / 3' }, { color: '#2b6f6f', ar: '3 / 4' },
    { color: '#4f5d2f', ar: '4 / 3' }, { color: '#9c4a2a', ar: '4 / 3' } ] },
];

const app = document.getElementById('app');
const feed = document.getElementById('feed');       // right column (scrolls)
const thumbsEl = document.getElementById('thumbs'); // left column (follows)
const menuBtn = document.getElementById('menuBtn');
const imgs = [];    // big images, in order
const thumbs = [];  // thumbnail buttons, same order

function paint(el, im) {
  el.style.aspectRatio = im.ar;
  if (im.src) el.style.backgroundImage = `url("${im.src}")`;
  else el.style.background = im.color;
}

/* ---- Build both columns from the data ---- */
PROJECTS.forEach((p, pi) => {
  const section = document.createElement('section');
  section.className = 'project';
  section.innerHTML = '<div class="project-head"><span></span><span></span></div>';
  section.querySelectorAll('.project-head span')[0].textContent = p.title;
  section.querySelectorAll('.project-head span')[1].textContent = p.venue;

  const group = document.createElement('div');
  group.className = 'thumb-group';

  p.images.forEach((im, ii) => {
    const idx = imgs.length;
    const label = `${pi + 1}.${ii + 1}`;

    const big = document.createElement('div');
    big.className = 'image';
    paint(big, im);
    big.innerHTML = `<span class="chip">${label}</span>` + (im.video ? '<span class="chip">VIDEO</span>' : '');
    section.appendChild(big);
    imgs.push(big);

    const row = document.createElement('div');
    row.className = 'thumb-row';
    const btn = document.createElement('button');
    btn.className = 'thumb';
    btn.setAttribute('aria-label', `Show image ${label}`);
    const fill = document.createElement('div');
    fill.className = 'fill';
    paint(fill, im);
    btn.appendChild(fill);
    btn.addEventListener('click', () => goTo(idx));
    row.appendChild(btn);
    if (im.video) row.insertAdjacentHTML('beforeend', '<span class="vlabel">VIDEO</span>');
    group.appendChild(row);
    thumbs.push(btn);
  });

  feed.appendChild(section);
  thumbsEl.appendChild(group);
});

/* ------------------------------------------------------------------
   Sync logic.
   An "anchor" {i, t} says where the middle of the feed sits: between
   image i and image i+1, a fraction t of the way along. The thumbnail
   column is scrolled so the same {i, t} lands at its own middle, which
   makes it glide continuously instead of jumping between thumbs.
------------------------------------------------------------------- */
const centers = (els) => els.map((el) => el.offsetTop + el.offsetHeight / 2);
const at = (cs, a) => (a.i + 1 < cs.length ? cs[a.i] + a.t * (cs[a.i + 1] - cs[a.i]) : cs[a.i]);

function measure() {
  const rc = centers(imgs);
  const c = feed.scrollTop + feed.clientHeight / 2;
  if (c <= rc[0]) return { i: 0, t: 0 };
  for (let i = 0; i < rc.length - 1; i++) {
    if (c < rc[i + 1]) return { i, t: (c - rc[i]) / (rc[i + 1] - rc[i]) };
  }
  return { i: rc.length - 1, t: 0 };
}

function syncLeft(a) {
  thumbsEl.scrollTop = at(centers(thumbs), a) - thumbsEl.clientHeight / 2;
}

function holdFeed(a) {
  feed.scrollTop = at(centers(imgs), a) - feed.clientHeight / 2;
}

let active = -1;
function setActive(n) {
  if (n === active) return;
  if (thumbs[active]) thumbs[active].classList.remove('active');
  active = n;
  thumbs[active].classList.add('active');
}

function sync() {
  const a = measure();
  syncLeft(a);
  setActive(Math.min(imgs.length - 1, a.t < 0.5 ? a.i : a.i + 1));
}

function goTo(i) {
  feed.scrollTo({ top: centers(imgs)[i] - feed.clientHeight / 2, behavior: 'smooth' });
}

/* Open/close: the feed narrows while the panel slides in, which would
   shift the content, so keep the current anchor pinned during the
   transition. */
function toggle() {
  const anchor = measure();
  const open = app.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', String(open));
  const start = performance.now();
  (function step() {
    holdFeed(anchor);
    syncLeft(anchor);
    if (performance.now() - start < 450) requestAnimationFrame(step);
    else sync();
  })();
}

let raf = 0;
feed.addEventListener('scroll', () => {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; sync(); });
}, { passive: true });
window.addEventListener('resize', sync);
menuBtn.addEventListener('click', toggle);
document.getElementById('closeBtn').addEventListener('click', toggle);

requestAnimationFrame(sync);
</script>
</body>
</html>
